<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <style>
      .h1{font-size:20px;font-weight:700;fill:#0f172a}
      .h2{font-size:13px;font-weight:700;fill:#334155}
      .t{font-size:11px;fill:#475569}
      .tn{font-size:10px;fill:#64748b}
      .box{rx:6;stroke-width:1.5}
      .flow{stroke:#475569;stroke-width:1.2;fill:none;marker-end:url(#a)}
      .warn{stroke:#dc2626;stroke-width:1.3;stroke-dasharray:5 3;fill:none}
    </style>
  </defs>

  <text x="520" y="28" text-anchor="middle" class="h1">Template Coordinate Flow</text>
  <text x="520" y="48" text-anchor="middle" class="tn">Step 11.1 — runtime architecture (no formula changes)</text>

  <!-- Production (isolated) -->
  <rect x="24" y="70" width="220" height="100" class="box" fill="#fae8ff" stroke="#9333ea"/>
  <text x="134" y="94" text-anchor="middle" class="h2">Production</text>
  <text x="134" y="112" text-anchor="middle" class="t">production.ts</text>
  <text x="134" y="128" text-anchor="middle" class="tn">350×500 mm · 300 DPI</text>
  <text x="134" y="144" text-anchor="middle" class="tn">layer _cm → export</text>
  <text x="134" y="160" text-anchor="middle" class="tn">✗ no template px</text>

  <!-- Physical -->
  <rect x="280" y="70" width="240" height="100" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="400" y="94" text-anchor="middle" class="h2">A. Physical</text>
  <text x="400" y="112" text-anchor="middle" class="t">template-metrics · shirt-template</text>
  <text x="400" y="128" text-anchor="middle" class="tn">1024×1536 · 612 chest px</text>
  <text x="400" y="144" text-anchor="middle" class="tn">12.24 px/cm overlay</text>
  <text x="400" y="160" text-anchor="middle" class="tn">Runtime ✅ · Production ❌</text>

  <!-- Profile -->
  <rect x="560" y="70" width="220" height="100" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="670" y="94" text-anchor="middle" class="h2">F. Profile</text>
  <text x="670" y="112" text-anchor="middle" class="t">template-profile</text>
  <text x="670" y="128" text-anchor="middle" class="tn">JSON mirror + calibration</text>
  <text x="670" y="144" text-anchor="middle" class="tn">Runtime: silhouetteScale only</text>
  <text x="670" y="160" text-anchor="middle" class="tn">Script: full profile</text>

  <!-- Visual -->
  <rect x="820" y="70" width="196" height="100" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="918" y="94" text-anchor="middle" class="h2">B. Visual</text>
  <text x="918" y="112" text-anchor="middle" class="t">ShirtVisualScale</text>
  <text x="918" y="128" text-anchor="middle" class="tn">shirtScale × 1.1127</text>
  <text x="918" y="144" text-anchor="middle" class="tn">PNG only · 550px armpit ref</text>
  <text x="918" y="160" text-anchor="middle" class="tn">✗ Blue / layer / export</text>

  <!-- Canvas -->
  <rect x="200" y="210" width="640" height="56" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="520" y="234" text-anchor="middle" class="h2">Template Canvas 1024×1536 (PREVIEW_CONTAINER / ADULT_TSHIRT_TEMPLATE_SPEC)</text>
  <text x="520" y="252" text-anchor="middle" class="tn">center (512, 768)</text>

  <!-- Placement -->
  <rect x="120" y="300" width="280" height="96" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="260" y="324" text-anchor="middle" class="h2">C. Placement</text>
  <text x="260" y="342" text-anchor="middle" class="t">GARMENT_TEMPLATE_OFFSET_PX (0,0)</text>
  <text x="260" y="358" text-anchor="middle" class="t">getGarmentPrintReference()</text>
  <text x="260" y="374" text-anchor="middle" class="tn">center anchor + translate(-50%,-50%)</text>
  <text x="260" y="388" text-anchor="middle" class="tn">Blue DOM position</text>

  <!-- Print -->
  <rect x="440" y="300" width="280" height="96" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="580" y="324" text-anchor="middle" class="h2">D. Print Overlay</text>
  <text x="580" y="342" text-anchor="middle" class="t">35×50 / 38×45 cm · 12.24 px/cm</text>
  <text x="580" y="358" text-anchor="middle" class="t">design-cm · preview · garment-print-config</text>
  <text x="580" y="374" text-anchor="middle" class="tn">Blue size = cm × shirtScale</text>
  <text x="580" y="388" text-anchor="middle" class="tn">Layer % inside blue</text>

  <!-- Collar -->
  <rect x="760" y="300" width="256" height="96" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="888" y="324" text-anchor="middle" class="h2">Collar / Offset</text>
  <text x="888" y="342" text-anchor="middle" class="t">COLLAR_ANCHOR_Y = 386px</text>
  <text x="888" y="358" text-anchor="middle" class="t">PRINT_AREA_OFFSET 7/5 cm</text>
  <text x="888" y="374" text-anchor="middle" class="tn">Orange safe zone %</text>
  <text x="888" y="388" text-anchor="middle" class="tn">printTopPx metrics</text>

  <!-- DOM stack -->
  <rect x="120" y="430" width="800" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="140" y="454" class="h2">Runtime DOM Stack</text>
  <text x="140" y="476" class="t">ShirtContainerFrame (Canvas Zoom)</text>
  <text x="160" y="496" class="t">└─ 1024×1536 container</text>
  <text x="180" y="516" class="t">├─ ShirtVisualScale → PNG [B Visual]</text>
  <text x="180" y="536" class="t">└─ div[data-print-area] [D Print] anchor [C Placement]</text>
  <text x="200" y="556" class="t">├─ Orange [Collar] · Grid · Layer cm % [→ Production truth]</text>

  <!-- Do not mix -->
  <rect x="24" y="590" width="992" height="150" rx="8" fill="#fff1f2" stroke="#fecaca"/>
  <text x="40" y="614" class="h2">Do Not Mix</text>
  <text x="40" y="636" class="t">✗ 12.24 px/cm (print overlay) ↔ 10.577 px/cm (PNG garment silhouette)</text>
  <text x="40" y="656" class="t">✗ silhouetteScale ↔ layer cm / export mm</text>
  <text x="40" y="676" class="t">✗ Designer back 38×45 ↔ Production export 35×50</text>
  <text x="40" y="696" class="t">✗ Profile collar 494 ↔ Runtime collar 386 (profile not wired)</text>
  <text x="40" y="716" class="t">✗ Template preview px ↔ Export 300 DPI px</text>

  <!-- Keep / remove -->
  <text x="40" y="770" class="h2">Keep forever</text>
  <text x="40" y="788" class="t">production mm · layer cm · shirtScale · overlay px/cm bridge · silhouetteScale · 1024×1536</text>
  <text x="40" y="820" class="h2">Future removable</text>
  <text x="40" y="838" class="t">garment-visual-calibration.ts · duplicate container constants · deprecated aliases · unwired profile fields</text>

  <!-- Arrows -->
  <path d="M400 170 L400 210" class="flow"/>
  <path d="M670 170 L580 210" class="flow"/>
  <path d="M918 170 L700 238" class="flow"/>
  <path d="M134 170 L134 250 L200 238" class="warn"/>
  <text x="148" y="220" class="tn" fill="#dc2626">design-cm bridge only</text>
  <path d="M400 266 L260 300" class="flow"/>
  <path d="M520 266 L580 300" class="flow"/>
  <path d="M600 266 L888 300" class="flow"/>
  <path d="M580 396 L580 430" class="flow"/>
  <path d="M260 396 L300 430" class="flow"/>
  <path d="M888 396 L700 520" class="flow"/>

  <text x="520" y="868" text-anchor="middle" class="tn">docs/architecture/template-coordinate-contract.md</text>
</svg>
