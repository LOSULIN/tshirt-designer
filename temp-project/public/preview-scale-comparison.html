<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Preview Scale Comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f4f5; padding: 24px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 13px; color: #52525b; margin-bottom: 20px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    .panel { background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 16px; }
    .panel h2 { font-size: 14px; margin-bottom: 8px; }
    .meta { font-size: 12px; color: #71717a; margin-bottom: 12px; font-family: ui-monospace, monospace; }
    .stage {
      position: relative;
      width: 512px;
      height: 768px;
      background: repeating-conic-gradient(#ddd 0% 25%, #eee 0% 50%) 50% / 20px 20px;
      border: 1px solid #d4d4d8;
      overflow: hidden;
    }
    .shirt {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .print-area {
      position: absolute;
      left: 50%;
      top: 51.37%;
      transform: translate(-50%, -50%);
      border: 2px dashed #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }
    .design {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(239, 68, 68, 0.55);
      border: 2px solid #dc2626;
    }
    .chest-line {
      position: absolute;
      left: 20.1%;
      right: 20.1%;
      top: 25.1%;
      height: 0;
      border-top: 2px solid #16a34a;
    }
    .chest-label {
      position: absolute;
      left: 20.1%;
      right: 20.1%;
      top: 23.5%;
      text-align: center;
      font-size: 10px;
      color: #16a34a;
      font-weight: 600;
    }
    .ratio {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .ratio.bad { color: #dc2626; }
    .ratio.good { color: #16a34a; }
  </style>
</head>
<body>
  <h1>Preview 比例修正：修改前 vs 修改後</h1>
  <p>M 胸寬 50 cm（模板 612 px）· 設計物件寬 29.6 cm · 目標占胸寬 59%</p>
  <div class="row">
    <div class="panel">
      <h2>修改前（10 px/cm）</h2>
      <div class="meta">印刷區 350×500 px · 設計 296 px 寬</div>
      <div class="stage" id="before">
        <img class="shirt" src="/templates/adult-tshirt-black-front.png" alt="shirt" />
        <div class="chest-label">胸寬 612 px（50 cm）</div>
        <div class="chest-line"></div>
        <div class="print-area" style="width:175px;height:250px">
          <div class="design" style="width:148px;height:40px"></div>
        </div>
      </div>
      <div class="ratio bad">296 / 612 = 48.4%</div>
    </div>
    <div class="panel">
      <h2>修改後（12.24 px/cm）</h2>
      <div class="meta">印刷區 428.4×612 px · 設計 362.3 px 寬</div>
      <div class="stage" id="after">
        <img class="shirt" src="/templates/adult-tshirt-black-front.png" alt="shirt" />
        <div class="chest-label">胸寬 612 px（50 cm）</div>
        <div class="chest-line"></div>
        <div class="print-area" style="width:214.2px;height:306px">
          <div class="design" style="width:181.15px;height:40px"></div>
        </div>
      </div>
      <div class="ratio good">362.3 / 612 = 59.2%</div>
    </div>
  </div>
  <script>
    // Scale 1024→512: multiply overlay px by 0.5
    // Print ref at 51.37% of 768 = 395.7px center Y
  </script>
</body>
</html>
